[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elif-ai-backend"
version = "1.0.0"
description = "Elif AI Backend API"
requires-python = ">=3.12"
dependencies = [
        "fastapi>=0.115,<1.0",
            "uvicorn[standard]>=0.34,<1.0",
                "sqlalchemy[asyncio]>=2.0,<3.0",
                    "asyncpg>=0.30,<1.0",
                        "alembic>=1.14,<2.0",
                            "pydantic>=2.10,<3.0",
                                "pydantic-settings>=2.7,<3.0",
                                    "email-validator>=2.2,<3.0",
                                        "pyjwt>=2.10,<3.0",
                                            "pwdlib[argon2]>=0.2,<1.0",
                                                "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
dev = [
        "httpx>=0.28,<1.0",
            "pytest>=8.3,<9.0",
                "pytest-asyncio>=0.25,<1.0",
                    "ruff>=0.9,<1.0",
                        "mypy>=1.14,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
